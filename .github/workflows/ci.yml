name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package:pack
      - run: npm ci
        working-directory: examples/node
      - run: node portrait.mjs ../../public/portrait.png /tmp/sfumato-example zh-CN
        working-directory: examples/node
